<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Loja de Teste</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; width: 250px; }
        button { background-color: #009ee3; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Escolha seu Produto</h2>

    <div class="card">
        <h3>Camiseta de Teste</h3>
        <p>Preço: R$ 10,00</p>
        <button onclick="comprar('Camiseta de Teste', 10.00)">Comprar Agora</button>
    </div>

    <script>
        async function comprar(titulo, preco) {
            const resposta = await fetch('/criar-preferencia', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ titulo: titulo, preco: preco })
            });

            const dados = await resposta.json();
            
            // Redireciona para o checkout de TESTE do Mercado Pago
            if (dados.sandbox_init_point) {
                window.location.href = dados.sandbox_init_point;
            } else {
                alert('Erro ao gerar o pagamento');
            }
        }
    </script>

</body>
</html>
