<style>
:root{--bg:#f1f5f9;--fg:#0f172a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--fg:#e2e8f0}}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:'Sora',system-ui,sans-serif}
.wrap{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;background:#fff;overflow:hidden}
svg{width:100%;height:100%;display:block}
.bar{position:absolute;left:0;bottom:0;height:4px;width:100%;background:#3b82f6;transform-origin:left;animation:prog 15s linear both}
text{font-family:'Sora',system-ui,sans-serif}

@keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{from{stroke-dashoffset:1;opacity:0}1%{opacity:1}to{stroke-dashoffset:0;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes bar{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes hand{0%,16%{transform:translate(170px,240px) scale(1.12)}32%{transform:translate(26px,38px) scale(1.06)}40%{transform:translate(32px,46px) scale(1.07)}48%{transform:translate(22px,34px) scale(1.06)}56%{transform:translate(24px,36px) scale(1.09)}60%,66%{transform:translate(0,0) scale(1)}74%,100%{transform:translate(40px,60px) scale(1.1)}}
@keyframes key{0%,58%{transform:none}60%{transform:translateY(4px)}67%,100%{transform:none}}
@keyframes glow{0%,48%{opacity:0;transform:scale(.6)}56%{opacity:.9;transform:scale(1.1)}60%{opacity:1}68%,100%{opacity:0;transform:scale(2)}}
@keyframes sceneOut{0%,58%{transform:scale(1);opacity:1}69%{transform:scale(1.5);opacity:1}74%,100%{transform:scale(1.5);opacity:0}}
@keyframes ripB{0%,60%{transform:scale(0)}70%,100%{transform:scale(1)}}
@keyframes ripW{0%,66%{transform:scale(0)}76%,100%{transform:scale(1)}}
@keyframes bub{0%{opacity:0;transform:translateY(8px) scale(.3)}30%{opacity:.9}100%{opacity:0;transform:translateY(-34px) scale(1)}}

#scene{transform-origin:736px 466px;animation:sceneOut 10s ease-in both}
.hand{transform-origin:736px 466px;animation:hand 10s ease-in-out both}
.key{animation:key 10s both}
.glow{transform-origin:736px 466px;animation:glow 10s ease-out both}
.rb,.rw{transform-origin:736px 466px}
.rb{animation:ripB 10s cubic-bezier(.6,0,.3,1) both}
.rw{animation:ripW 10s cubic-bezier(.6,0,.3,1) both}
.line{stroke-dasharray:1;animation:draw 4s ease-out .8s both}
.b{transform-box:fill-box;transform-origin:bottom;animation:bar .6s ease-out both}
.prompt{animation:fade .4s 4.8s both,pulse 1s 5.2s infinite}
.hex{transform-origin:480px 162px;animation:pop .8s cubic-bezier(.2,1.4,.4,1) 7.2s both}
.ic{fill:none;stroke:#fff;stroke-width:13;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1}
.dot{transform-box:fill-box;transform-origin:center;animation:pop .35s cubic-bezier(.2,1.6,.4,1) 8.3s both}
.bub{fill:none;stroke:#3b82f6;stroke-width:2.5;transform-box:fill-box;transform-origin:center;animation:bub 1.1s ease-out both}
</style>
</head>
<body>
<div class="wrap" id="wrap">
<svg viewBox="-100 -60 1160 652" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Visão em primeira pessoa: uma mão aperta Enter no teclado diante de um painel financeiro e revela a logo EnterSight">

<linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6c7a3"/><stop offset="1" stop-color="#e3a074"/></linearGradient>

<g id="scene">

<g style="filter:drop-shadow(0 12px 18px rgba(15,23,42,.28))">

<rect x="130" y="18" width="700" height="354" rx="18" fill="#1e293b"/>

<g font-size="10" fill="#94a3b8"><text x="186" y="114">Receita</text><text x="394" y="114">Margem</text><text x="602" y="114">Crescimento</text></g>
<g font-size="18" font-weight="700" fill="#fff"><text x="186" y="136">R$ 1,28 mi</text><text x="394" y="136">32,4%</text><text x="602" y="136" fill="#22c55e">+24,8%</text></g>
<g stroke="#1e2a44" stroke-width="1.5"><line x1="172" y1="330" x2="784" y2="330" stroke="#334155" stroke-width="2"/><line x1="172" y1="270" x2="784" y2="270"/><line x1="172" y1="210" x2="784" y2="210"/></g>
<g id="bars" fill="#3b82f6" opacity=".55"></g>
<path class="line" pathLength="1" d="M201,274 L251,262 L301,268 L351,244 L401,250 L451,226 L501,234 L551,210 L601,218 L651,190 L701,196 L751,168" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text class="prompt" x="480" y="346" font-size="11" fill="#93c5fd" text-anchor="middle">Pressione Enter para continuar</text>

<rect x="-1000" y="392" width="2960" height="1000" fill="url(#desk)"/>
<rect x="-1000" y="392" width="2960" height="3" fill="#fff" opacity=".6"/>
<g style="filter:drop-shadow(0 10px 14px rgba(15,23,42,.35))">
<polygon points="221,402 739,402 895,545 65,545" fill="#b6c2d1"/>

<g class="hand">
<g transform="translate(736,466) rotate(-35)" style="filter:drop-shadow(-8px 12px 9px rgba(15,23,42,.35))">
<rect x="-36" y="236" width="142" height="420" fill="#1f3a5f"/>
<rect x="-24" y="236" width="8" height="420" fill="#3b6aa3" opacity=".5"/>
<rect x="-38" y="224" width="146" height="20" rx="4" fill="#f8fafc"/>
<rect x="-32" y="90" width="130" height="140" rx="48" fill="url(#skin)"/>
<rect x="-36" y="196" width="142" height="26" rx="9" fill="#0f172a"/>
<rect x="22" y="192" width="30" height="32" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
<circle cx="37" cy="208" r="5" fill="#3b82f6"/>
<g stroke-linecap="round">
<line x1="-28" y1="170" x2="-20" y2="104" stroke="#e8a97e" stroke-width="24"/>
<line x1="76" y1="94" x2="76" y2="132" stroke="#e8a97e" stroke-width="22"/>
<line x1="53" y1="82" x2="53" y2="132" stroke="#eaae84" stroke-width="26"/>
<line x1="28" y1="70" x2="28" y2="132" stroke="#edb28a" stroke-width="28"/>
<line x1="0" y1="14" x2="0" y2="140" stroke="#f2bb92" stroke-width="30"/>
</g>

</g>
</g>

<circle class="rb" cx="736" cy="466" r="2400" fill="#3b82f6"/>
<circle class="rw" cx="736" cy="466" r="2400" fill="#fff"/>

<g>
<g class="hex"><path d="M480,52 L577,106 L577,220 L480,273 L384,220 L384,106Z" fill="#3b82f6" stroke="#3b82f6" stroke-width="10" stroke-linejoin="round"/></g>
<path class="ic" pathLength="1" d="M426,161 L460,132 L486,150 L520,115" style="animation:draw .6s ease-out 7.7s both"/>
<path class="ic" pathLength="1" d="M529,112 V201 H443" style="animation:draw .6s ease-out 8.1s both"/>
<path class="ic" pathLength="1" d="M463,181 L443,202 L463,222" style="animation:draw .3s ease-out 8.6s both"/>
<circle class="dot" cx="529" cy="107" r="13" fill="#fff"/>
<circle class="bub" style="animation-delay:7.3s" cx="372" cy="120" r="11"/>
<circle class="bub" style="animation-delay:7.42s" cx="592" cy="96" r="7"/>
<circle class="bub" style="animation-delay:7.54s" cx="600" cy="236" r="5"/>

<text x="480" y="381" font-size="98" text-anchor="middle" fill="#000" style="animation:rise .7s ease-out 8.3s both; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; letter-spacing: -0.02em;">

<script>
(function(){
  var NS='http://www.w3.org/2000/svg',kb=document.getElementById('kb'),ek=document.getElementById('ek'),bars=document.getElementById('bars');
  var tb=[0,.15,.32,.52,.76,1],Y=function(t){return 402+138*t},L=function(t){return 225-115*t},R=function(t){return 735+115*t};
  var P=function(t,u){return (L(t)+(R(t)-L(t))*u).toFixed(1)+','+Y(t).toFixed(1)};
  function key(r,u0,u1,parent,fill,stroke){
    var t0=tb[r]+.012,t1=tb[r+1]-.012,a=u0+.004,b=u1-.004,p=document.createElementNS(NS,'polygon');
    p.setAttribute('points',[P(t0,a),P(t0,b),P(t1,b),P(t1,a)].join(' '));
    p.setAttribute('fill',fill||'#f8fafc');p.setAttribute('stroke',stroke||'#cbd5e1');
    parent.appendChild(p);
  }
  function row(r,n,from,to){for(var i=0;i<n;i++)key(r,from+(to-from)*i/n,from+(to-from)*(i+1)/n,kb);}
  row(0,14,0,1);row(1,14,0,1);row(2,11,0,.855);row(3,13,0,1);
  [0,.1,.2,.3,.7,.8,.9,1].forEach(function(u,i,a){if(i<a.length-1)key(4,u,a[i+1],kb);});
  
  key(2,.855,1,ek,'#3b82f6','#2563eb');
  
  // Texto ligeiramente deslocado para a esquerda para o centro perfeito
  ek.insertAdjacentHTML('beforeend','<text x="736" y="460" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="central">Enter ↵</text>');
  
  var h=[40,52,46,70,64,88,80,104,96,124,118,146];
  h.forEach(function(v,i){
    var r=document.createElementNS(NS,'rect');
    r.setAttribute('class','b');r.setAttribute('x',186+i*50);r.setAttribute('y',330-v);
    r.setAttribute('width',30);r.setAttribute('height',v);r.setAttribute('rx',4);
    r.style.animationDelay=(0.8+i*0.3)+'s';bars.appendChild(r);
  });
})();

(function(){
  try{
    var AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended'){AC.resume().catch(function(){});}
    var t=AC.currentTime;
    var tone=function(at,f0,f1,d,v,type){
      var o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';
      o.frequency.setValueAtTime(f0,at);o.frequency.exponentialRampToValueAtTime(f1,at+d);
      g.gain.setValueAtTime(0.0001,at);g.gain.exponentialRampToValueAtTime(v,at+0.015);
      g.gain.exponentialRampToValueAtTime(0.0001,at+d+0.06);
      o.connect(g);g.connect(AC.destination);o.start(at);o.stop(at+d+0.1);
    };
    tone(t+6.0,220,90,0.05,0.14,'triangle');
    tone(t+7.2,280,820,0.20,0.35);
    tone(t+7.34,520,1250,0.12,0.25);
    tone(t+7.46,820,1750,0.09,0.18);
    tone(t+7.7,600,1400,0.08,0.1);
  }catch(e){}
})();

// Redirecionamento automático após 15 segundos
(function(){
  var urlDestino = "{{ destino or '/landing' }}";
  console.log("[DataInsight] Redirecionamento configurado para: " + urlDestino + " em 15 segundos.");
  var redirecionado = false;
  function irParaDestino(){
    if (!redirecionado) {
      redirecionado = true;
      console.log("[DataInsight] Redirecionando agora para: " + urlDestino);
      window.location.href = urlDestino;
    }
  }

  // Redireciona estritamente após 15 segundos
  setTimeout(irParaDestino, 15000);

  // Permite avançar antes apenas ao pressionar a tecla Enter (conforme a animação do teclado)
  document.addEventListener('keydown', function(e){
    if (e.key === 'Enter') {
      irParaDestino();
    }
  });
})();
</script>
</body>
</html>
