<div class="sidebar__header">
  <a class="sidebar__logo" href="{{ url_for('pagina_landing') }}" aria-label="DataInsight - Início">
<img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo DataInsight" style="max-width: 33px; height: auto;">
    <span class="sidebar__logo-text">DataInsight</span>
    {% if is_mei %}
      <span style="display:inline-block; margin-left:6px; padding:2px 6px; border-radius:6px; font-size:10px; font-weight:800; background:#10b981; color:#ffffff; letter-spacing:0.04em;">MEI</span>
    {% else %}
      <span style="display:inline-block; margin-left:6px; padding:2px 6px; border-radius:6px; font-size:10px; font-weight:800; background:#3b82f6; color:#ffffff; letter-spacing:0.04em;">ME</span>
    {% endif %}
  </a>
</div>

<nav aria-label="Navegação principal">
  <span class="nav-section-label">Principal</span>

  <a href="{{ url_for('pagina_home') }}"
     {% if request.endpoint=='pagina_home' %}aria-current="page"{% endif %}>
    <i class="fa-solid fa-house"></i>
    Início
  </a>

  <a href="{{ url_for('pagina_dados') }}"
     {% if request.endpoint=='pagina_dados' %}aria-current="page"{% endif %}>
    <i class="fa-solid fa-table-list"></i>
    Dados
  </a>

  <a href="{{ url_for('pagina_graficoAvancado') }}"
     {% if request.endpoint=='pagina_graficoAvancado' %}aria-current="page"{% endif %}>
    <i class="fa-solid fa-layer-group"></i>
    Dashboard
  </a>

  <span class="nav-section-label">Análise</span>

  <a href="{{ url_for('pagina_analise') }}"
     {% if request.endpoint=='pagina_analise' %}aria-current="page"{% endif %}>
    <i class="fa-solid fa-chart-line"></i>
    Análises
  </a>

  <a href="{{ url_for('pagina_fluxo_caixa') }}"
   {% if request.endpoint=='pagina_fluxo_caixa' %}aria-current="page"{% endif %}>
    <i class="fa-solid fa-right-left"></i>
    Fluxo de Caixa
  </a>

  {% if is_mei %}
  <a href="{{ url_for('pagina_controles_essenciais') }}"
   {% if request.endpoint=='pagina_controles_essenciais' %}aria-current="page"{% endif %}>
    <i class="fa-solid fa-sliders"></i>
    Controles Essenciais
  </a>
  {% else %}
  <a href="{{ url_for('pagina_planejamento_financeiro') }}"
   {% if request.endpoint=='pagina_planejamento_financeiro' %}aria-current="page"{% endif %}>
    <i class="fa-solid fa-chart-pie"></i>
    Planejamento
  </a>
  {% endif %}

  <a href="{{ url_for('pagina_relatorio') }}"
     {% if request.endpoint=='pagina_relatorio' %}aria-current="page"{% endif %}>
    <i class="fa-solid fa-file-pdf"></i>
    Relatórios
  </a>

  <a href="{{ url_for('pagina_ia') }}"
     {% if request.endpoint=='pagina_ia' %}aria-current="page"{% endif %}>
    <i class="fa-solid fa-brain"></i>
    Centro de Inteligência
  </a>

  <a href="{{ url_for('pagina_analises_salvas') }}"
     {% if request.endpoint=='pagina_analises_salvas' %}aria-current="page"{% endif %}>
    <i class="fa-solid fa-bookmark"></i>
    Análises Salvas
  </a>

  <span class="nav-section-label">Conta</span>

  <a href="{{ url_for('pagina_perfil') }}"
     {% if request.endpoint=='pagina_perfil' %}aria-current="page"{% endif %}>
    <i class="fa-solid fa-user"></i>
    Perfil
  </a>

  <a href="{{ url_for('pagina_configuracoes') }}"
     {% if request.endpoint=='pagina_configuracoes' %}aria-current="page"{% endif %}>
    <i class="fa-solid fa-gear"></i>
    Configurações
  </a>
</nav>

<div class="sidebar__footer">
  <a href="{{ url_for('logout') }}">
    <i class="fa-solid fa-right-from-bracket"></i>
    Sair
  </a>
</div>
