<div class="sidebar__header" style="display: flex; justify-content: center; align-items: center; width: 100%; padding: 16px 0; margin-left: -12px; margin-right: -12px; width: calc(100% + 24px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); box-sizing: border-box;">
  <a class="sidebar__logo" href="{{ url_for('pagina_landing') }}" aria-label="EnterSight - Início" style="display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;">
    
    <!-- Logo Hexagonal (EnterSight) -->
    <svg viewBox="374 42 212 241" width="38" height="42" aria-label="Logo EnterSight" role="img" style="display: inline-block; flex-shrink: 0; vertical-align: middle;">
      <g>
        <path d="M480,52 L577,106 L577,220 L480,273 L384,220 L384,106Z" fill="#3b82f6" stroke="#3b82f6" stroke-width="10" stroke-linejoin="round"/>
        <path d="M426,161 L460,132 L486,150 L520,115" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M529,112 V201 H443" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M463,181 L443,202 L463,222" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="529" cy="107" r="13" fill="#ffffff"/>
      </g>
    </svg>
    
    <!-- Texto e Badge -->
    <div style="display: flex; align-items: center; gap: 8px;">
      <span class="sidebar__logo-text" style="font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 1.5rem; color: var(--texto); letter-spacing: -0.02em; white-space: nowrap; display: inline-flex;">
        <span style="font-weight: 700;">Enter</span><span style="font-weight: 300;">Sight</span>
      </span>
      {% if is_mei %}
        <span style="display: inline-block; padding: 3px 6px; border-radius: 6px; font-size: 11px; font-weight: 800; background: #10b981; color: #ffffff; letter-spacing: 0.04em;">MEI</span>
      {% else %}
        <span style="display: inline-block; padding: 3px 6px; border-radius: 6px; font-size: 11px; font-weight: 800; background: #3b82f6; color: #ffffff; letter-spacing: 0.04em;">ME</span>
      {% endif %}
    </div>

  </a> 
</div>
<nav aria-label="Navegação principal">
  <span class="nav-section-label">Principal</span>

  <a href="{{ url_for('pagina_home') }}"
     class="{% if rota_ativa('pagina_home') %}active{% endif %}"
     {% if rota_ativa('pagina_home') %}aria-current="page"{% endif %}>
    <i class="fa-solid fa-house"></i>
    Início
  </a>

  <a href="{{ url_for('pagina_dados') }}"
     class="{% if rota_ativa('pagina_dados') %}active{% endif %}"
     {% if rota_ativa('pagina_dados') %}aria-current="page"{% endif %}>
    <i class="fa-solid fa-table-list"></i>
    Dados
  </a>

  <a href="{{ url_for('pagina_graficoAvancado') }}"
     class="{% if rota_ativa('pagina_graficoAvancado', 'pagina_dashboard') %}active{% endif %}"
     {% if rota_ativa('pagina_graficoAvancado', 'pagina_dashboard') %}aria-current="page"{% endif %}>
    <i class="fa-solid fa-layer-group"></i>
    Dashboard
  </a>

  <span class="nav-section-label">Análise</span>

  <a href="{{ url_for('pagina_analise') }}"
     class="{% if rota_ativa('pagina_analise') %}active{% endif %}"
     {% if rota_ativa('pagina_analise') %}aria-current="page"{% endif %}>
    <i class="fa-solid fa-chart-line"></i>
    Análises
  </a>

  <a href="{{ url_for('pagina_fluxo_caixa') }}"
     class="{% if rota_ativa('pagina_fluxo_caixa') %}active{% endif %}"
     {% if rota_ativa('pagina_fluxo_caixa') %}aria-current="page"{% endif %}>
    <i class="fa-solid fa-right-left"></i>
    Fluxo de Caixa
  </a>

  {% if is_mei %}
  <a href="{{ url_for('pagina_controles_essenciais') }}"
     class="{% if rota_ativa('pagina_controles_essenciais') %}active{% endif %}"
     {% if rota_ativa('pagina_controles_essenciais') %}aria-current="page"{% endif %}>
    <i class="fa-solid fa-sliders"></i>
    Controles Essenciais
  </a>
  {% else %}
  <a href="{{ url_for('pagina_planejamento_financeiro') }}"
     class="{% if rota_ativa('pagina_planejamento_financeiro') %}active{% endif %}"
     {% if rota_ativa('pagina_planejamento_financeiro') %}aria-current="page"{% endif %}>
    <i class="fa-solid fa-chart-pie"></i>
    Planejamento
  </a>
  {% endif %}

  <a href="{{ url_for('pagina_relatorio') }}"
     class="{% if rota_ativa('pagina_relatorio', 'pagina_relatorio_pdf') %}active{% endif %}"
     {% if rota_ativa('pagina_relatorio', 'pagina_relatorio_pdf') %}aria-current="page"{% endif %}>
    <i class="fa-solid fa-file-pdf"></i>
    Relatórios
  </a>

  <a href="{{ url_for('pagina_ia') }}"
     class="{% if rota_ativa('pagina_ia', 'pagina_ia_financeiro', 'pagina_ia_decisoes', 'pagina_ia_operacional', 'pagina_assistente_virtual', 'pagina_assistente') %}active{% endif %}"
     {% if rota_ativa('pagina_ia', 'pagina_ia_financeiro', 'pagina_ia_decisoes', 'pagina_ia_operacional', 'pagina_assistente_virtual', 'pagina_assistente') %}aria-current="page"{% endif %}>
    <i class="fa-solid fa-brain"></i>
    Centro de Inteligência
  </a>

  <a href="{{ url_for('pagina_analises_salvas') }}"
     class="{% if rota_ativa('pagina_analises_salvas') %}active{% endif %}"
     {% if rota_ativa('pagina_analises_salvas') %}aria-current="page"{% endif %}>
    <i class="fa-solid fa-bookmark"></i>
    Análises Salvas
  </a>

  <span class="nav-section-label">Conta</span>

  <a href="{{ url_for('pagina_perfil') }}"
     class="{% if rota_ativa('pagina_perfil') %}active{% endif %}"
     {% if rota_ativa('pagina_perfil') %}aria-current="page"{% endif %}>
    <i class="fa-solid fa-user"></i>
    Perfil
  </a>

  <a href="{{ url_for('pagina_configuracoes') }}"
     class="{% if rota_ativa('pagina_configuracoes') %}active{% endif %}"
     {% if rota_ativa('pagina_configuracoes') %}aria-current="page"{% endif %}>
    <i class="fa-solid fa-gear"></i>
    Configurações
  </a>
</nav>

<div class="sidebar__footer">
  <a href="{{ url_for('logout') }}">
    <i class="fa-solid fa-right-from-bracket"></i>
    Sair
  </a>
</div>
