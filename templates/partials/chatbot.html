        async function configurarSeletorPlanilhaChatbotFlutuante() {
            const select = document.getElementById('chatbot-seletor-planilha');
            if (!select) return;
            try {
                const resp = await fetch('/api/planilhas/sumario');
                if (!resp.ok) return;
                const json = await resp.json();
                const planilhas = json.planilhas || [];
                
                select.innerHTML = '';
                const optTodas = document.createElement('option');
                optTodas.value = 'todas';
                optTodas.style.color = 'black';
                optTodas.textContent = `🌐 Todas as Planilhas (${planilhas.length})`;
                select.appendChild(optTodas);
                
                planilhas.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.style.color = 'black';
                    const icone = p.tipo_fluxo === 'saida' ? '🔻' : (p.tipo_fluxo === 'entrada' ? '🟢' : '📁');
                    opt.textContent = `${icone} [${p.dominio_label}] ${p.nome}`;
                    select.appendChild(opt);
                });

                const salva = localStorage.getItem('DataInsight_DashboardPlanilha');
                if (salva && (salva === 'todas' || planilhas.some(p => p.id === salva))) {
                    select.value = salva;
                }

                select.addEventListener('change', e => {
                    localStorage.setItem('DataInsight_DashboardPlanilha', e.target.value);
                });

                console.warn('Aviso ao carregar planilhas no chatbot flutuante:', e);

        function obterValorPersonalizado(elemento) {
            if (!elemento || !(elemento instanceof Element)) return null;
            const explicit = elemento.dataset.iaHelpValue;
            if (!explicit) return null;
            const valor = explicit.trim();
            if (!valor) return null;

            if (valor.startsWith('#') || valor.startsWith('.')) {
                const target = elemento.querySelector(valor) || document.querySelector(valor);
                return target ? target.textContent.trim() : null;
            }

            return valor;
        }

        function extrairValorDoElemento(elemento) {
            const explicit = obterValorPersonalizado(elemento);
            if (explicit) return explicit;
            if (!elemento || !(elemento instanceof Element)) return null;
            const texto = Array.from(elemento.querySelectorAll('span, p, h1, h2, h3, div, strong, em'))
                .map(el => el.textContent.trim())
                .filter(Boolean)
                .join(' ');
            const match = texto.match(/[-+]?[0-9]{1,3}(?:[.,][0-9]{3})*(?:[.,][0-9]+)?/);
            return match ? match[0] : null;
        }

        function gerarAnaliseContextual(elemento, dados) {
            const descricao = dados.description || '';
            const valor = extrairValorDoElemento(elemento);
            const trend = elemento.dataset.iaHelpTrend;
            const highlight = elemento.dataset.iaHelpHighlight;
            let analise = descricao;

            if (valor) {
                analise += ` Atualmente, o valor visível nesta área é ${valor}.`;
            }

            if (trend) {
                analise += ` Tendência observada: ${trend}.`;
            }

            if (highlight) {
                analise += ` Observação: ${highlight}.`;
            }

            if (!valor && !trend && !highlight) {
                analise += ' Clique em detalhes para ver números e comparações específicas.';
            }

            return analise.trim();
        }

        const dragHandle = document.getElementById('chatbot-drag-handle');
        const resizeHandle = document.getElementById('chatbot-resize-handle');
        let isDragging = false;
        let isResizing = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let startLeft = 0;
        let startTop = 0;
        let startWidth = 0;
        let startHeight = 0;

        function iniciarDrag(event) {
            if (event.target.closest('.chatbot-close-btn')) return;
            if (!card.classList.contains('active')) return;
            isDragging = true;
            dragStartX = event.clientX;
            dragStartY = event.clientY;
            startLeft = card.getBoundingClientRect().left;
            startTop = card.getBoundingClientRect().top;
            card.style.right = 'auto';
            card.style.bottom = 'auto';
            document.body.style.userSelect = 'none';
        }

        function moverDrag(event) {
            if (!isDragging) return;
            const deltaX = event.clientX - dragStartX;
            const deltaY = event.clientY - dragStartY;
            const newLeft = Math.min(Math.max(10, startLeft + deltaX), window.innerWidth - card.offsetWidth - 10);
            const newTop = Math.min(Math.max(10, startTop + deltaY), window.innerHeight - card.offsetHeight - 10);
            card.style.left = `${newLeft}px`;
            card.style.top = `${newTop}px`;
        }

        function finalizarDrag() {
            if (!isDragging) return;
            isDragging = false;
            document.body.style.userSelect = '';
            salvarEstadoChatbot();
        }

        function iniciarResize(event) {
            isResizing = true;
            dragStartX = event.clientX;
            dragStartY = event.clientY;
            startWidth = card.offsetWidth;
            startHeight = card.offsetHeight;
            document.body.style.userSelect = 'none';
            event.stopPropagation();
        }

        function moverResize(event) {
            if (!isResizing) return;
            const deltaX = event.clientX - dragStartX;
            const deltaY = event.clientY - dragStartY;
            const newWidth = Math.max(CHATBOT_MIN_WIDTH, Math.min(window.innerWidth - 20, startWidth + deltaX));
            const newHeight = Math.max(CHATBOT_MIN_HEIGHT, Math.min(window.innerHeight - 20, startHeight + deltaY));
            card.style.width = `${newWidth}px`;
            card.style.height = `${newHeight}px`;
        }

        function finalizarResize() {
            if (!isResizing) return;
            isResizing = false;
            document.body.style.userSelect = '';
            salvarEstadoChatbot();
        }

        if (dragHandle) {
            dragHandle.style.cursor = 'move';
            dragHandle.style.touchAction = 'none';
            dragHandle.addEventListener('pointerdown', iniciarDrag);
        }
        if (resizeHandle) {
            resizeHandle.style.touchAction = 'none';
            resizeHandle.addEventListener('pointerdown', iniciarResize);
        }
        document.addEventListener('pointermove', (event) => {
            moverDrag(event);
            moverResize(event);
        });
        document.addEventListener('pointerup', () => {
            finalizarDrag();
            finalizarResize();
        });

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/\"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function adicionarMensagem(htmlOuTexto, remetente, jaMarcado = false) {
            const divMensagem = document.createElement('div');
            divMensagem.className = `message ${remetente}`;
            
            if (jaMarcado) {
                divMensagem.innerHTML = htmlOuTexto;
            } else {
                let textoFormatado = '';
                // Se vier um objeto/array, renderizar de forma amigável
                if (typeof htmlOuTexto === 'object') {
                    try {
                        if (Array.isArray(htmlOuTexto)) {
                            // array de objetos -> tabela
                            const arr = htmlOuTexto;
                            const keys = Array.from(arr.reduce((set, row) => { if (row && typeof row === 'object') Object.keys(row).forEach(k => set.add(k)); return set; }, new Set()));
                            textoFormatado = '<div class="table-responsive"><table><thead><tr>' + keys.map(k => `<th>${k}</th>`).join('') + '</tr></thead><tbody>' + arr.map(row => '<tr>' + keys.map(k => `<td>${row && row[k] !== undefined && row[k] !== null ? String(row[k]) : ''}</td>`).join('') + '</tr>').join('') + '</tbody></table></div>';
                        } else {
                            // objeto simples -> pretty JSON
                            textoFormatado = `<pre class="json">${escapeHtml(JSON.stringify(htmlOuTexto, null, 2))}</pre>`;
                        }
                    } catch (e) {
                        textoFormatado = escapeHtml(String(htmlOuTexto));
                    }
                    divMensagem.innerHTML = textoFormatado;
                } else {
                    textoFormatado = htmlOuTexto;
                    if (typeof marked !== 'undefined') {
                        textoFormatado = marked.parse(String(htmlOuTexto));
                    } else {
                        textoFormatado = String(htmlOuTexto)
                            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                            .replace(/\n/g, '<br>')
                            .replace(/- (.*?)(<br>|$)/g, '<li>$1</li>');
                    }
                    divMensagem.innerHTML = textoFormatado;
                }
            }
            
            messagesContainer.appendChild(divMensagem);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            salvarMensagensNoStorage();
            return divMensagem;
        }

        function salvarMensagensNoStorage() {
            const messages = [];
            messagesContainer.querySelectorAll('.message:not(.typing)').forEach(el => {
                messages.push({
                    html: el.innerHTML,
                    remetente: el.classList.contains('user') ? 'user' : 'bot'
                });
            });
            const payload = JSON.stringify(messages);
            sessionStorage.setItem(CHATBOT_MESSAGES_KEY, payload);
            localStorage.setItem(CHATBOT_MESSAGES_KEY, payload);
        }

        function carregarMensagensSalvas() {
            let saved = sessionStorage.getItem(CHATBOT_MESSAGES_KEY);
            if (!saved) {
                saved = localStorage.getItem(CHATBOT_MESSAGES_KEY);
            }
            if (!saved) return;
            try {
                const messages = JSON.parse(saved);
                if (messages && messages.length > 0) {
                    messagesContainer.innerHTML = '';
                    messages.forEach(m => {
                        adicionarMensagem(m.html, m.remetente, true);
                    });
                }
            } catch (e) {
                console.warn('Erro ao carregar mensagens salvas:', e);
            }
        }

        const audioContext = window.AudioContext ? new window.AudioContext() : null;

        function tocarBolha(tipo = 'open') {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                const filter = ctx.createBiquadFilter();
                osc.type = 'triangle';
                osc.frequency.value = tipo === 'open' ? 920 : 700;
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(tipo === 'open' ? 1600 : 1200, ctx.currentTime);
                gain.gain.setValueAtTime(tipo === 'open' ? 0.6 : 0.4, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.28);
                osc.connect(filter);
                filter.connect(gain);
                gain.connect(ctx.destination);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.28);
                osc.onended = () => { try { ctx.close(); } catch(e) {} };
            } catch(err) {
                console.warn('Erro ao tocar bolha:', err);
            }
        }

        function pararMicrofoneParaFala() {
            microfoneBloqueado = true;
            ignorarResultados = true;
            iniciarAposFala = false;
            if (recognition) {
                try { recognition.stop(); } catch(e) {}
                recognition = null;
            }
        }

        function reativarMicrofoneAposFala() {
            setTimeout(() => {
                microfoneBloqueado = false;
                ignorarResultados = false;
                if (vozAtiva && vozAtivaNoBrowser && !recognition) {
                    try { iniciarReconhecimento(); } catch(e) {
                        console.warn('Erro ao reativar reconhecimento após fala:', e);
                    }
                }
            }, 1000);
        }

        function falarTexto(texto) {
            if (!texto || typeof window === 'undefined' || !('speechSynthesis' in window)) return;
            pararMicrofoneParaFala();
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'pt-BR';
            utterance.onend = () => { reativarMicrofoneAposFala(); };
            utterance.onerror = () => { reativarMicrofoneAposFala(); };
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }

        function mostrarPainelVoz(comMensagemPadrao = false) {
            if (voiceStatus) voiceStatus.textContent = 'Aguardando comando de voz...';
            if (voiceTranscript) voiceTranscript.textContent = '';
            if (voiceResponse) voiceResponse.textContent = '';
            tocarBolha();
            if (vozAtiva && vozAtivaNoBrowser && !recognition) {
                if (!comMensagemPadrao) {
                    iniciarReconhecimento();
                } else {
                    iniciarAposFala = true;
                }
            }
            if (comMensagemPadrao) {
                const mensagemPadrao = 'Olá! Como posso ajudar você hoje?';
                if (voiceResponse) {
                    voiceResponse.innerHTML = `<p><strong>${mensagemPadrao}</strong></p>`;
                }
                if (voiceStatus) voiceStatus.textContent = 'Assistente pronto. Diga sua pergunta.';

                if (vozAtiva && vozAtivaNoBrowser) {
                    try { if (recognition) { recognition.stop(); recognition = null; } } catch(e) { console.warn('Erro ao parar reconhecimento:', e); }
                    ignorarResultados = true;
                    fetch('/api/chatbot/sintetizar', {
                        method: 'POST',
                        credentials: 'same-origin',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ texto: mensagemPadrao })
                    })
                    .then(res => res.json().then(data => ({ ok: res.ok, data })))
                    .then(({ ok, data }) => {
                        if (ok && data.resposta_voz_base64) {
                            try { if (recognition) { recognition.stop(); recognition = null; } } catch(e) { console.warn('Erro ao parar reconhecimento:', e); }
                            iniciarAposFala = true;
                            const audio = new Audio(`data:${data.resposta_voz_mimetype};base64,${data.resposta_voz_base64}`);
                            audio.onended = () => {
                                ignorarResultados = false;
                                if (iniciarAposFala) {
                                    iniciarAposFala = false;
                                    try { iniciarReconhecimento(); } catch(e) { console.warn('Erro ao iniciar reconhecimento após fala:', e); }
                                }
                            };
                            audio.onerror = () => {
                                ignorarResultados = false;
                                console.warn('Falha ao reproduzir áudio Kokoro, usando TTS fallback.');
                                try { if (recognition) { recognition.stop(); recognition = null; } } catch(e) {}
                                iniciarAposFala = true;
                                falarTexto(mensagemPadrao);
                            };
                            audio.play().catch(() => {
                                ignorarResultados = false;
                                console.warn('Falha ao reproduzir áudio Kokoro, usando TTS fallback.');
                                try { if (recognition) { recognition.stop(); recognition = null; } } catch(e) {}
                                iniciarAposFala = true;
                                falarTexto(mensagemPadrao);
                            });
                        } else {
                            ignorarResultados = false;
                            if (data.erro) {
                                console.warn('Kokoro não disponível:', data.erro);
                            }
                            try { if (recognition) { recognition.stop(); recognition = null; } } catch(e) {}
                            iniciarAposFala = true;
                            falarTexto(mensagemPadrao);
                        }
                    })
                    .catch((error) => {
                        console.error('Erro ao chamar /api/chatbot/sintetizar:', error);
                        ignorarResultados = false;
                        falarTexto(mensagemPadrao);
                    });
                } else {
                    falarTexto(mensagemPadrao);
                }
            }
        }

        function esconderPainelVoz() {
            tocarBolha();
        }

        function ativarReconhecimentoContinuo() {
            if (!vozAtiva || recognition || !vozAtivaNoBrowser) return;
            if (voiceStatus) {
                voiceStatus.textContent = 'Microfone pronto. Diga "data" a qualquer momento.';
            }
            iniciarReconhecimento();
        }

        async function iniciarReconhecimento() {
            if (!vozAtiva || recognition || !vozAtivaNoBrowser) return;

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                if (voiceStatus) voiceStatus.textContent = 'Seu navegador não oferece suporte a reconhecimento de voz.';
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                if (voiceStatus) voiceStatus.textContent = 'Assistente ativo. Diga "data" para abrir o modal.';
                console.log('SpeechRecognition iniciado');
            };

            recognition.onaudiostart = () => {
                console.log('Audio start');
            };

            recognition.onspeechstart = () => {
                if (voiceStatus) voiceStatus.textContent = 'Ouvindo...';
                console.log('Speech start');
            };

            recognition.onspeechend = () => {
                if (voiceStatus) voiceStatus.textContent = 'Esperando novo comando...';
                console.log('Speech end');
            };

            recognition.onaudioend = () => {
                console.log('Audio end');
            };

            recognition.onresult = (event) => {
                if (ignorarResultados || microfoneBloqueado) {
                    console.log('Ignorando resultado de reconhecimento enquanto o sistema fala.');
                    return;
                }

                const transcript = event.results[event.results.length - 1][0].transcript.trim();
                if (!transcript) return;
                if (voiceTranscript) voiceTranscript.textContent = transcript;

                const textoMinusculo = transcript.toLowerCase();
                const textoNormalizado = textoMinusculo
                    .normalize('NFD')
                    .replace(/[\u0300-\u036f]/g, '')
                    .replace(/[^a-z0-9 ]/g, '')
                    .replace(/\s+/g, ' ')
                    .trim();

                console.log('Resultado speech normalizado:', textoNormalizado);

                let textoAposWake = '';
                const wakeMatch = textoNormalizado.match(/\b(data|dados|assistant)\b/i);
                if (wakeMatch && typeof wakeMatch.index === 'number') {
                    textoAposWake = textoNormalizado.slice(wakeMatch.index + wakeMatch[0].length).trim();
                }

                const acionouWake = !!wakeMatch;
                console.log('Wake:', acionouWake, 'textoAposWake:', textoAposWake);

                if (acionouWake) {
                    abrirChatbot();
                    if (typeof document !== 'undefined' && typeof document.dispatchEvent === 'function') {
                        document.dispatchEvent(new Event('DataInsight_OpenIaModal'));
                    }
                    if (typeof window !== 'undefined' && typeof window.dispatchEvent === 'function') {
                        window.dispatchEvent(new Event('DataInsight_OpenIaModal'));
                    }
                    if (voiceStatus) {
                        voiceStatus.textContent = 'Palavra-chave detectada. Abrindo assistente...';
                    }
                    mostrarPainelVoz(true);
                    if (textoAposWake) {
                        enviarMensagem(textoAposWake);
                    }
                    return;
                }

                if (voiceStatus) {
                    voiceStatus.textContent = 'Pergunta recebida. Processando...';
                }
                enviarMensagem(transcript);
            };

            recognition.onerror = (event) => {
                if (event?.error === 'no-speech') {
                    console.warn('SpeechRecognition no-speech recebido; reiniciando...', event);
                    if (voiceStatus) voiceStatus.textContent = 'Nenhuma fala detectada. Tentando novamente...';
                    return;
                }
                if (voiceStatus) voiceStatus.textContent = `Erro no reconhecimento de voz: ${event?.error || 'desconhecido'}. Reiniciando...`;
                console.error('SpeechRecognition error', event);
            };

            recognition.onend = () => {
                recognition = null;
                if (vozAtiva && !microfoneBloqueado) {
                    setTimeout(iniciarReconhecimento, 500);
                }
            };

            try {
                recognition.start();
                if (voiceStatus) voiceStatus.textContent = 'Microfone ativo. Diga "data" para abrir o assistente.';
            } catch (erro) {
                if (voiceStatus) voiceStatus.textContent = 'Não foi possível iniciar o microfone automaticamente.';
            }
        }

        function exibirRespostaNoPainel(texto) {
            if (!voiceResponse) return;
            const respostaRaw = (texto || '').trim();
            if (!respostaRaw) {
                voiceResponse.innerHTML = '<p>Sem resposta para exibir.</p>';
                return;
            }

            // Tenta interpretar como JSON primeiro
            let parsed = null;
            try {
                parsed = JSON.parse(respostaRaw);
            } catch (e) {
                parsed = null;
            }

            // Render helper: cria tabela responsiva a partir de array de objetos
            function buildTableFromArray(arr) {
                if (!Array.isArray(arr) || arr.length === 0) return '<p>Sem dados tabulares.</p>';
                const keys = Array.from(arr.reduce((set, row) => {
                    if (row && typeof row === 'object') Object.keys(row).forEach(k => set.add(k));
                    return set;
                }, new Set()));
                let html = '<div class="table-responsive"><table><thead><tr>' + keys.map(k => `<th>${k}</th>`).join('') + '</tr></thead><tbody>';
                arr.forEach(row => {
                    html += '<tr>' + keys.map(k => `<td>${row && row[k] !== undefined && row[k] !== null ? String(row[k]) : ''}</td>`).join('') + '</tr>';
                });
                html += '</tbody></table></div>';
                return html;
            }

            // Se for objeto JS válido, renderizar de forma estruturada
            if (parsed && typeof parsed === 'object') {
                // Caso: payload com html já pronto
                if (parsed.html && typeof parsed.html === 'string') {
                    voiceResponse.innerHTML = parsed.html;
                }
                // Caso: tabela como array em `table` ou `tabela` ou payload é array diretamente
                else if (Array.isArray(parsed)) {
                    voiceResponse.innerHTML = buildTableFromArray(parsed);
                } else if (Array.isArray(parsed.table) || Array.isArray(parsed.tabela) || Array.isArray(parsed.rows)) {
                    const arr = parsed.table || parsed.tabela || parsed.rows;
                    voiceResponse.innerHTML = buildTableFromArray(arr);
                }
                // Caso geral: mostrar JSON formatado com possibilidade de colapsar
                else {
                    const pretty = JSON.stringify(parsed, null, 2);
                    voiceResponse.innerHTML = `<pre class="json">${escapeHtml(pretty)}</pre>`;
                }
            }
            // Se a resposta contém HTML (tabelas/markup), renderiza como HTML
            else if (/</.test(respostaRaw)) {
                voiceResponse.innerHTML = respostaRaw;
            }
            // Caso padrão: tratar como Markdown/Texto
            else {
                // usa a biblioteca marked para renderizar markdown (já incluída)
                try {
                    const md = typeof marked !== 'undefined' ? marked.parse(respostaRaw) : respostaRaw.replace(/\n/g, '<br>');
                    voiceResponse.innerHTML = md;
                } catch (e) {
                    voiceResponse.innerHTML = respostaRaw.replace(/\n/g, '<br>');
                }
            }

            // Após renderizar, garantir que tabelas fiquem responsivas e aplicar gráficos
            // Wrap any plain table elements in a responsive container if not already wrapped
            voiceResponse.querySelectorAll('table').forEach((tbl) => {
                if (tbl.parentElement && tbl.parentElement.classList && tbl.parentElement.classList.contains('table-responsive')) return;
                const wrapper = document.createElement('div');
                wrapper.className = 'table-responsive';
                tbl.parentNode.insertBefore(wrapper, tbl);
                wrapper.appendChild(tbl);
            });

            // Inicializa possíveis gráficos declarados como containers com classe .grafico-ia-render
            const graficos = voiceResponse.querySelectorAll('.grafico-ia-render');
            graficos.forEach((container) => {
                const periodo = container.getAttribute('data-periodo') || '30_dias';
                const tipoRaw = container.getAttribute('data-tipo') || 'linha';
                const metricasRaw = container.getAttribute('data-metricas') || 'faturamento,lucro';
                const title = container.getAttribute('data-titulo') || 'Gráfico';
                const tipo = tipoRaw === 'pizza' ? 'pie' : tipoRaw === 'barras' ? 'bar' : 'line';
                if (typeof ApexCharts !== 'undefined') {
                    fetch(`/api/graficos?periodo=${periodo}`)
                        .then(res => res.json())
                        .then(data => {
                            let chartData = null;
                            let options = null;
                            if (tipo === 'pie') chartData = data.grafico_pizza;
                            else if (tipo === 'bar') chartData = data.grafico_barras;
                            else chartData = data.grafico_linha;
                            if (!chartData || !chartData.labels) return;
                            options = {
                                chart: { type, height: 220, toolbar: { show: false }, background: 'transparent' },
                                series: chartData.series,
                                labels: chartData.labels,
                                xaxis: { categories: chartData.labels },
                                legend: { show: true },
                                title: { text: title }
                            };
                            container.innerHTML = '';
                            const chart = new ApexCharts(container, options);
                            chart.render();
                        }).catch(() => {});
                }
            });

            // Pequena função utilitária para escapar HTML em JSON pretty-print
            function escapeHtml(str) {
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/\"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }
        }

        async function enviarMensagem(texto) {
            const textoLimpo = (texto || input.value || '').trim();
            if (!textoLimpo) return;

            // Intercepta comandos de fechamento por voz
            if (processVoiceClose(textoLimpo)) return;

            // Cancelar requisição anterior e parar áudio em andamento
            if (currentAbortController) {
                currentAbortController.abort();
                currentAbortController = null;
            }
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }

            latestRequestId = ++currentRequestId;
            const requestId = latestRequestId;

            adicionarMensagem(textoLimpo, 'user');
            if (input) input.value = '';
            document.querySelectorAll('.message.bot.typing').forEach(el => el.remove());

            const divDigitando = document.createElement('div');
            divDigitando.className = 'message bot typing';
            divDigitando.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
            messagesContainer.appendChild(divDigitando);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            const abortController = new AbortController();
            currentAbortController = abortController;

            try {
                pararMicrofoneParaFala();
                console.log('Enviando texto para o chatbot:', textoLimpo, 'sessao_id=', currentSessionId);
                
                const selectPlanilha = document.getElementById('chatbot-seletor-planilha');
                const tabelaId = selectPlanilha ? selectPlanilha.value : 'todas';

                const resposta = await fetch('/api/chatbot/perguntar', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mensagem: textoLimpo, sessao_id: currentSessionId, tabela_id: tabelaId }),
                    signal: abortController.signal
                });

                const dados = await resposta.json().catch(() => null);
                if (!resposta.ok || !dados) {
                    const erroMsg = dados && dados.erro ? dados.erro : `Erro ${resposta.status}`;
                    throw new Error(erroMsg);
                }

                // Se uma nova pergunta foi enviada enquanto esperávamos, descarta esta resposta
                if (requestId !== latestRequestId) {
                    if (messagesContainer.contains(divDigitando)) messagesContainer.removeChild(divDigitando);
                    return;
                }

                if (messagesContainer.contains(divDigitando)) messagesContainer.removeChild(divDigitando);
                adicionarMensagem(dados.resposta, 'bot');
                exibirRespostaNoPainel(dados.resposta);

                if (voiceStatus) voiceStatus.textContent = 'Resposta pronta.';

                // Reproduzir áudio da resposta com proteção de microfone
                const reproduzirAudio = () => {
                    if (requestId !== latestRequestId) {
                        reativarMicrofoneAposFala();
                        return;
                    }
                    if (dados.resposta_voz_base64) {
                        const audio = new Audio(`data:${dados.resposta_voz_mimetype};base64,${dados.resposta_voz_base64}`);
                        currentAudio = audio;
                        audio.onended = () => { currentAudio = null; reativarMicrofoneAposFala(); };
                        audio.onerror = () => {
                            currentAudio = null;
                            console.warn('Falha ao reproduzir áudio Kokoro, usando TTS fallback.');
                            falarTexto(dados.resposta);
                        };
                        audio.play().catch(() => {
                            currentAudio = null;
                            falarTexto(dados.resposta);
                        });
                    } else if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
                        falarTexto(dados.resposta);
                    } else {
                        reativarMicrofoneAposFala();
                    }
                };
                reproduzirAudio();

            } catch (erro) {
                if (erro.name === 'AbortError') {
                    // Requisição cancelada por nova pergunta – não exibir erro
                    if (messagesContainer.contains(divDigitando)) messagesContainer.removeChild(divDigitando);
                    return;
                }
                if (messagesContainer.contains(divDigitando)) messagesContainer.removeChild(divDigitando);
                reativarMicrofoneAposFala();
                adicionarMensagem("Desculpe, estou com dificuldades para me conectar agora. Verifique sua conexão.", 'bot');
                exibirRespostaNoPainel('Erro ao processar a resposta.');
                if (voiceStatus) voiceStatus.textContent = 'Erro ao processar a resposta.';
            }
        }

        sendBtn.addEventListener('click', () => enviarMensagem(input.value));
        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') enviarMensagem(input.value);
        });

        if (vozAtiva && vozAtivaNoBrowser) {
            ativarReconhecimentoContinuo();
        }

        window.addEventListener('storage', (event) => {
            if (event.key !== 'vozAtiva') return;
            vozAtiva = event.newValue !== 'false';
            if (vozAtiva && vozAtivaNoBrowser) {
                ativarReconhecimentoContinuo();
            } else if (!vozAtiva && recognition) {
                try { recognition.stop(); } catch (e) { console.warn('Falha ao parar reconhecimento após alteração de configuração:', e); }
                recognition = null;
            }
        });

        // Carregar opções de planilhas no seletor do chatbot
        configurarSeletorPlanilhaChatbotFlutuante();

    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initChatbot);
    } else {
        initChatbot();
    }
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
(function() {
    const STORAGE_KEY = 'DataInsight_IA_ModalState';
    const modal = document.getElementById('ia-modal');
    const modalWindow = document.querySelector('.ia-modal-window');
    const modalCloseBtn = document.getElementById('ia-modal-close');
    if (!modal || !modalWindow || !modalCloseBtn) return;

    function clamp(values) {
        const minWidth = 360;
        const minHeight = 280;
        const maxWidth = window.innerWidth - 40;
        const maxHeight = window.innerHeight - 40;
        return {
            top: Math.min(Math.max(10, values.top), Math.max(10, window.innerHeight - minHeight - 10)),
            left: Math.min(Math.max(10, values.left), Math.max(10, window.innerWidth - minWidth - 10)),
            width: Math.min(Math.max(minWidth, values.width), maxWidth),
            height: Math.min(Math.max(minHeight, values.height), maxHeight)
        };
    }

    function saveState(state) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function loadState() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return null;
        try {
            const state = JSON.parse(saved);
            if (!state || typeof state !== 'object') return null;
            return state;
        } catch (err) {
            console.warn('Falha ao carregar estado do modal IA:', err);
            return null;
        }
    }

    function applyState(state) {
        modalWindow.style.top = `${state.top}px`;
        modalWindow.style.left = `${state.left}px`;
        modalWindow.style.width = `${state.width}px`;
        modalWindow.style.height = `${state.height}px`;
    }

    function playBubbleSound(type = 'open') {
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const context = new AudioContext();
            const oscillator = context.createOscillator();
            const gain = context.createGain();
            const filter = context.createBiquadFilter();
            oscillator.type = 'triangle';
            oscillator.frequency.value = type === 'open' ? 920 : 520;
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(type === 'open' ? 1600 : 1000, context.currentTime);
            gain.gain.setValueAtTime(type === 'open' ? 0.22 : 0.16, context.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, context.currentTime + 0.24);
            oscillator.connect(filter);
            filter.connect(gain);
            gain.connect(context.destination);
            oscillator.start(context.currentTime);
            oscillator.stop(context.currentTime + 0.24);
            oscillator.onended = () => {
                try { context.close(); } catch (e) {}
            };
        } catch (error) {
            console.warn('Erro ao reproduzir som de bolha:', error);
        }
    }

    function showModal() {
        const lastState = loadState();
        if (lastState && lastState.top !== undefined) {
            applyState(clamp(lastState));
        } else {
            const defaultState = clamp({ top: 40, left: 40, width: Math.min(1040, window.innerWidth - 80), height: Math.min(700, window.innerHeight - 80) });
            applyState(defaultState);
        }
        modal.style.display = 'flex';
        modal.setAttribute('aria-hidden', 'false');
        playBubbleSound('open');
        saveState({ visible: true, top: parseInt(modalWindow.style.top, 10), left: parseInt(modalWindow.style.left, 10), width: parseInt(modalWindow.style.width, 10), height: parseInt(modalWindow.style.height, 10) });
    }

    function hideModal() {
        modal.style.display = 'none';
        modal.setAttribute('aria-hidden', 'true');
        playBubbleSound('close');
        const state = loadState() || { top: 40, left: 40, width: Math.min(1040, window.innerWidth - 80), height: Math.min(700, window.innerHeight - 80) };
        saveState({ ...state, visible: false });
    }

    document.addEventListener('DataInsight_OpenIaModal', showModal);
    document.addEventListener('DataInsight_CloseIaModal', hideModal);

    const saved = loadState();
    if (saved && saved.visible) {
        showModal();
    }
})();
</script>
