<!-- Overlay da sidebar mobile -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="fecharSidebar()"></div>

<!-- Bottom Navigation Mobile -->
<nav class="navbar-bottom" aria-label="Navegação mobile">
  <a class="navbar-bottom__item {% if rota_ativa('pagina_home') %}active{% endif %}"
     href="{{ url_for('pagina_home') }}" aria-label="Início"
     {% if rota_ativa('pagina_home') %}aria-current="page"{% endif %}>
    <i class="fa-solid fa-house"></i>
    <span>Início</span>
  </a>

  <a class="navbar-bottom__item {% if rota_ativa('pagina_dados') %}active{% endif %}"
     href="{{ url_for('pagina_dados') }}" aria-label="Dados"
     {% if rota_ativa('pagina_dados') %}aria-current="page"{% endif %}>
    <i class="fa-solid fa-table-list"></i>
    <span>Dados</span>
  </a>

  <a class="navbar-bottom__item {% if rota_ativa('pagina_graficoAvancado', 'pagina_dashboard') %}active{% endif %}"
     href="{{ url_for('pagina_graficoAvancado') }}" aria-label="Dashboard"
     {% if rota_ativa('pagina_graficoAvancado', 'pagina_dashboard') %}aria-current="page"{% endif %}>
    <i class="fa-solid fa-layer-group"></i>
    <span>Dashboard</span>
  </a>

  <a class="navbar-bottom__item {% if rota_ativa('pagina_analise') %}active{% endif %}"
     href="{{ url_for('pagina_analise') }}" aria-label="Análises"
     {% if rota_ativa('pagina_analise') %}aria-current="page"{% endif %}>
    <i class="fa-solid fa-chart-line"></i>
    <span>Análises</span>
  </a>

  <a class="navbar-bottom__item {% if rota_ativa('pagina_fluxo_caixa') %}active{% endif %}"
     href="{{ url_for('pagina_fluxo_caixa') }}"
     aria-label="Fluxo de Caixa"
     {% if rota_ativa('pagina_fluxo_caixa') %}aria-current="page"{% endif %}>
    <i class="fa-solid fa-right-left"></i>
    <span>Fluxo Caixa</span>
  </a>

  {% if is_mei %}
  <a class="navbar-bottom__item {% if rota_ativa('pagina_controles_essenciais') %}active{% endif %}"
     href="{{ url_for('pagina_controles_essenciais') }}"
     aria-label="Controles Essenciais"
     {% if rota_ativa('pagina_controles_essenciais') %}aria-current="page"{% endif %}>
    <i class="fa-solid fa-sliders"></i>
    <span>Controles</span>
  </a>
  {% else %}
  <a class="navbar-bottom__item {% if rota_ativa('pagina_planejamento_financeiro') %}active{% endif %}"
     href="{{ url_for('pagina_planejamento_financeiro') }}"
     aria-label="Planejamento"
     {% if rota_ativa('pagina_planejamento_financeiro') %}aria-current="page"{% endif %}>
    <i class="fa-solid fa-chart-pie"></i>
    <span>Planejamento</span>
  </a>
  {% endif %}

  <a class="navbar-bottom__item {% if rota_ativa('pagina_relatorio', 'pagina_relatorio_pdf') %}active{% endif %}"
     href="{{ url_for('pagina_relatorio') }}" aria-label="Relatórios"
     {% if rota_ativa('pagina_relatorio', 'pagina_relatorio_pdf') %}aria-current="page"{% endif %}>
    <i class="fa-solid fa-file-pdf"></i>
    <span>Relatórios</span>
  </a>

  <a class="navbar-bottom__item {% if rota_ativa('pagina_ia', 'pagina_ia_financeiro', 'pagina_ia_decisoes', 'pagina_ia_operacional', 'pagina_assistente_virtual', 'pagina_assistente') %}active{% endif %}"
     href="{{ url_for('pagina_ia') }}" aria-label="IA"
     {% if rota_ativa('pagina_ia', 'pagina_ia_financeiro', 'pagina_ia_decisoes', 'pagina_ia_operacional', 'pagina_assistente_virtual', 'pagina_assistente') %}aria-current="page"{% endif %}>
    <i class="fa-solid fa-robot"></i>
    <span>Centro de Inteligência</span>
  </a>

  <a class="navbar-bottom__item {% if rota_ativa('pagina_analises_salvas') %}active{% endif %}"
     href="{{ url_for('pagina_analises_salvas') }}" aria-label="Análises Salvas"
     {% if rota_ativa('pagina_analises_salvas') %}aria-current="page"{% endif %}>
    <i class="fa-solid fa-bookmark"></i>
    <span>Análises Salvas</span>
  </a>

  <a class="navbar-bottom__item {% if rota_ativa('pagina_perfil') %}active{% endif %}"
     href="{{ url_for('pagina_perfil') }}" aria-label="Perfil"
     {% if rota_ativa('pagina_perfil') %}aria-current="page"{% endif %}>
    <i class="fa-solid fa-user"></i>
    <span>Perfil</span>
  </a>
</nav>
