<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EnterSight • Redefinir Senha</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='acessibilidade/acessibilidade.css') }}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  </head>

    <!-- icon -->
  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='favicons/apple-touch-icon.png') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicons/favicon-32x32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicons/favicon-16x16.png') }}">
  <link rel="shortcut icon" href="{{ url_for('static', filename='favicons/favicon.ico') }}">

  <body>
    <header class="barra-topo" role="banner">
          <a class="sidebar__logo" href="{{ url_for('pagina_landing') }}" aria-label="EnterSight - Início">
<!-- Logo Hexagonal (EnterSight) -->
            <svg viewBox="374 42 212 241" width="38" height="42" aria-label="Logo EnterSight" role="img" style="display: inline-block; flex-shrink: 0; vertical-align: middle;">
              <g>
                <path d="M480,52 L577,106 L577,220 L480,273 L384,220 L384,106Z" fill="#3b82f6" stroke="#3b82f6" stroke-width="10" stroke-linejoin="round"/>
                <path d="M426,161 L460,132 L486,150 L520,115" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M529,112 V201 H443" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M463,181 L443,202 L463,222" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="529" cy="107" r="13" fill="#ffffff"/>
              </g>
            </svg>
            <span class="sidebar__logo-text" style="font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 1.9rem; color: var(--texto); letter-spacing: -0.02em; white-space: nowrap; display: inline-flex;">
              <span style="font-weight: 700;">Enter</span><span style="font-weight: 300;">Sight</span>
            </span>
        </a>
      

    </header>

    <main class="autenticacao" role="main" data-ia-help="page_redefinir_senha">
      <section class="cartao autenticacao__cartao" aria-labelledby="titulo-reset">
        
        <h1 id="titulo-reset" class="autenticacao__titulo">Redefinir Senha</h1>
        <p class="autenticacao__subtitulo">
          Digite sua nova senha abaixo.
        </p>

        <form method="POST" style="margin-top: 24px; display: grid; gap: 16px;">
          
          {% if erro %}
            <div style="background-color: #fee; color: #c00; padding: 12px; border-radius: 4px;">
              {{ msg or 'Erro ao redefinir senha' }}
            </div>
          {% endif %}

          
          <div class="campo">
            <label class="obrigatorio" for="nova_senha">Nova senha</label>
            <div class="campo-senha">
              <input
                placeholder="Ex: Xxx20xx@"
                class="entrada"
                id="nova_senha"
                name="nova_senha"
                type="password"
                required
              />
              <span class="olho-senha" onclick="togglePassword('nova_senha', this)" aria-label="Mostrar ou ocultar senha">
                <i class="fa-solid fa-eye"></i>
              </span>
            </div>
          </div>

          
          <div class="campo">
            <label class="obrigatorio" for="confirmar_senha">Confirmar senha</label>
            <div class="campo-senha">
              <input
                placeholder="Digite novamente"
                class="entrada"
                id="confirmar_senha"
                name="confirmar_senha"
                type="password"
                required
              />
              <span class="olho-senha" onclick="togglePassword('confirmar_senha', this)" aria-label="Mostrar ou ocultar senha">
                <i class="fa-solid fa-eye"></i>
              </span>
            </div>
          </div>

          <button class="botao botao--primario" type="submit">
            Redefinir senha
          </button>

          <div class="autenticacao__links">
            <a href="{{ url_for('pg_login') }}">Voltar para login</a>
          </div>

        </form>
      </section>
    </main>

    <!-- u{2672} Painel Avan�ado de Acessibilidade -->
  {% include 'partials/painel_acessibilidade.html' %}


    
</div>

<script src="{{ url_for('static', filename='acessibilidade/acessibilidade.js') }}"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  </body>
</html>
